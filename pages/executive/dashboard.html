<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive dashboard — ClubHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>

<header id="topnav" class="topnav"></header>

<div class="layout">

    <aside id="sidebar" class="sidebar"></aside>

    <main class="main" style="margin-right:320px">

        <div class="pulse" id="pulse"></div>

        <div id="tab-club-settings" class="tab-pane"></div>
        <div id="tab-events" class="tab-pane" style="display:none"></div>
        <div id="tab-meetings" class="tab-pane" style="display:none"></div>
        <div id="tab-board-members" class="tab-pane" style="display:none"></div>
        <div id="tab-posts" class="tab-pane" style="display:none"></div>
        <div id="tab-products" class="tab-pane" style="display:none"></div>
        <div id="tab-members" class="tab-pane" style="display:none"></div>
        <div id="tab-join-requests" class="tab-pane" style="display:none"></div>
        <div id="tab-announcements" class="tab-pane" style="display:none"></div>
        <div id="tab-gallery" class="tab-pane" style="display:none"></div>
        <div id="tab-orders" class="tab-pane" style="display:none"></div>

    </main>

    <aside class="chat-sidebar" id="chatSidebar"></aside>

</div>

<footer id="siteFooter"></footer>

<script src="../../js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
<script src="../../js/executive-dashboard.js"></script>

</body>
</html>
