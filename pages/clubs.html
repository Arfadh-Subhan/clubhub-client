<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clubs &amp; societies — ClubHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>

<header id="topnav" class="topnav"></header>

<div class="layout">

    <aside id="sidebar" class="sidebar"></aside>

    <main class="main">

        <div class="pulse" id="pulse"></div>

        <div class="section-head">
            <div>
                <h2>Clubs &amp; societies</h2>
                <div class="sub">Send a join request — the board reviews it before you're added as a member.</div>
            </div>
            <div class="head-actions">
                <div class="search-box">
                    <input id="clubSearch" placeholder="Search clubs">
                </div>
            </div>
        </div>

        <div id="clubGrid" class="grid">
            <div class="loading">Loading clubs...</div>
        </div>

    </main>

</div>

<footer id="siteFooter"></footer>

<script src="../js/common.js"></script>
<script src="../js/clubs.js"></script>

</body>
</html>
