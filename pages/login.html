<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ClubHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>

<header id="topnav" class="topnav"></header>

<div class="layout">

    <aside id="sidebar" class="sidebar"></aside>

    <main class="main">

        <div class="login-panel">
            <h2>Welcome back</h2>
            <div class="sub">Log in to continue</div>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="loginEmail" maxlength="100" required>
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required>
                </div>

                <div id="loginMessage" class="alert hidden"></div>

                <button class="btn full" type="submit">Sign in</button>
            </form>

            <div style="text-align:center;font-size:13px;color:var(--ink-soft);margin-top:16px">
                Don't have an account?
                <a href="register.html" style="color:var(--ink);font-weight:600;text-decoration:underline">Register</a>
            </div>
        </div>

    </main>

</div>

<footer id="siteFooter"></footer>

<script src="../js/common.js"></script>
<script src="../js/login.js"></script>

</body>
</html>
