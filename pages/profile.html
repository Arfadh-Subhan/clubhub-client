<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My profile — ClubHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>

<header id="topnav" class="topnav"></header>

<div class="layout">

    <aside id="sidebar" class="sidebar"></aside>

    <main class="main">

        <div class="section-head">
            <div>
                <h2>My profile</h2>
                <div class="sub">This is what societies see when you register.</div>
            </div>
        </div>

        <div class="login-panel" style="max-width:540px;margin:0">

            <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px">
                <img id="profilePhotoPreview" src="" alt="" style="width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--panel-2);display:none">
                <div id="profilePhotoPlaceholder" style="width:72px;height:72px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700">U</div>
                <div>
                    <label class="btn ghost sm" style="cursor:pointer">
                        Change photo
                        <input type="file" accept="image/*" style="display:none" id="profilePhotoInput">
                    </label>
                </div>
            </div>

            <form id="profileForm">

                <div class="form-row">
                    <div class="field">
                        <label>Full name</label>
                        <input type="text" id="pfFullName" maxlength="100" required>
                    </div>
                    <div class="field">
                        <label>Phone number</label>
                        <input type="text" id="pfPhone" maxlength="15" required>
                    </div>
                </div>

                <div class="field">
                    <label>Semester</label>
                    <input type="text" id="pfSemester" maxlength="20" required>
                </div>

                <div class="form-row">
                    <div class="field">
                        <label>Student ID</label>
                        <input type="text" id="pfStudentId" disabled style="background:var(--panel-2);cursor:not-allowed">
                    </div>
                    <div class="field">
                        <label>Role</label>
                        <input type="text" id="pfRole" disabled style="background:var(--panel-2);cursor:not-allowed">
                    </div>
                </div>

                <div class="field">
                    <label>Email</label>
                    <input type="email" id="pfEmail" disabled style="background:var(--panel-2);cursor:not-allowed">
                </div>

                <div id="profileMessage" class="alert hidden"></div>

                <button class="btn full" type="submit">Save changes</button>

            </form>

        </div>

    </main>

</div>

<footer id="siteFooter"></footer>

<script src="../js/common.js"></script>
<script src="../js/profile.js"></script>

</body>
</html>
